const BL=['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'],p2=n=>('0'+n).slice(-2);
function toISO(v){v=String(v==null?'':v).trim();let m;
 if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
 if(m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/)){let d=+m[1],o=+m[2],y=+m[3];if(y<100)y+=y>30?1900:2000;if(o>12&&d<=12){const x=d;d=o;o=x}return y+'-'+p2(o)+'-'+p2(d)}
 if(m=v.match(/^(\d{1,2})\s+([a-z]+)\s+(\d{4})$/i)){const i=BL.indexOf(m[2].toLowerCase());if(i>=0)return m[3]+'-'+p2(i+1)+'-'+p2(m[1])}
 return ''}
function fmtTgl(v){const i=toISO(v);if(!i)return v==null?'':v;const a=i.split('-'),b=BL[a[1]-1];return (+a[2])+' '+b[0].toUpperCase()+b.slice(1)+' '+a[0]}

const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const ld=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u});
async function proc(f,W,H2,mime,crop){const i=await ld(await rd(f)),c=document.createElement('canvas');
 if(crop){c.width=W;c.height=H2;const r=W/H2;let sw=i.width,sh=i.height;if(sw/sh>r)sw=sh*r;else sh=sw/r;c.getContext('2d').drawImage(i,(i.width-sw)/2,(i.height-sh)*0.25,sw,sh,0,0,W,H2)}
 else{const k=Math.min(1,W/i.width);c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height)}
 return c.toDataURL(mime,.88)}

function qrSrc(s){const st=S.settings;if(st.qr_mode=='upload'){if(s.qr_url)return s.qr_url;if(st.qr_fallback!='ya')return''}
 const t=(st.qr_format||'{nisn}').replace(/\{(\w+)\}/g,(m,k)=>s[k]==null?'':s[k]);
 if(!QC[t]){const d=document.createElement('div');new QRCode(d,{text:t,width:256,height:256,correctLevel:QRCode.CorrectLevel.M});QC[t]=d.querySelector('canvas').toDataURL()}return QC[t]}

 const rp=v=>String(v==null?'':v).replace(/\{(\w+)\}/g,(m,k)=>S.settings[k]!=null?S.settings[k]:(s[k]==null?'':s[k]));
 if(e.t=='text')h=esc(rp(e.v));
 else if(e.t=='field'){const v=esc(val(s,e.src));h=e.l?'<span style="display:inline-block;width:'+(e.lw==null?15:e.lw)+'mm">'+esc(e.l)+'</span><span style="display:inline-block;width:'+(e.cg==null?3:e.cg)+'mm">:</span>'+v:v}

 else if(e.t=='line')st+='border-top:.3mm solid '+(e.c||'#111')+';height:0;';
 return '<div class="el'+(ed&&i==sel?' sel':'')+'" data-i="'+i+'" style="'+st+'">'+h+'</div>'}

function matchS(fn){const b=nk(fn.replace(/\.[^.]+$/,'')),A=[s=>s.nisn,s=>s.nis,s=>s.nama];for(const g of A){const m=S.siswa.filter(s=>nk(g(s))==b);if(m.length==1)return m[0]}return null}
async function bulk(fs,K){const el=K?'#qr':'#fr',pre=K?'qr_':'',ext=K?'.png':'.jpg',fld=K?'qr_url':'foto_url',miss=[],ok=[],rows=[];
 [...fs].forEach(f=>{const s=matchS(f.name);s?ok.push({f:f,s:s}):miss.push(f.name)});$(el).innerHTML='<div id="pgb"></div>';
 await pool(ok,async j=>{const d=K?await proc(j.f,400,400,'image/png',0):await proc(j.f,400,600,'image/jpeg',1),u=await up(pre+j.s.nisn+ext,d);if(!u)throw 0;const o={nisn:j.s.nisn};o[fld]=u;rows.push(o)});
 for(let i=0;i<rows.length;i+=50)await api('saveSiswa',{rows:rows.slice(i,i+50)});await load();
 $(el).innerHTML='✅ '+rows.length+(K?' QR':' foto')+' berhasil. ❌ Tidak cocok/nama ganda: '+(miss.length?esc(miss.join(', ')):'-')+(rows.length<ok.length?'. ⚠ Gagal upload: '+(ok.length-rows.length):'')+(K?'. Siswa belum punya QR: '+S.siswa.filter(s=>!s.qr_url).length:'')}

function doQR(fs){return bulk(fs,1)}

const T=()=>S.tpl[side].els;
P.tpl=()=>{sel=-1;H('<div class="cd"><div class="tb"><button class="bt '+(side=='depan'?'':'o')+'" onclick="side=\'depan\';P.tpl()">Kartu Depan</button><button class="bt '+(side=='belakang'?'':'o')+'" onclick="side=\'belakang\';P.tpl()">Kartu Belakang</button></div><div class="ed"><div><div id="edBox"></div><p class="mu">Ukuran 86 × 55 mm. Tarik elemen untuk menggeser.</p></div><div><b>+ Tambah Elemen</b><div>'+[['text','Teks'],['field','Data'],['photo','Foto'],['qr','QR'],['img','Gambar'],['line','Garis']].map(x=>'<button class="bt o" onclick="addE(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div><div id="props" style="margin-top:12px"></div></div></div><label>Latar template (PNG/JPG)<input type="file" accept="image/*" onchange="setBg(this.files[0])"></label><button class="bt o" onclick="S.tpl[side].bg=\'\';edDraw()">Hapus Latar</button><button class="bt g" onclick="saveTpl()">💾 Simpan Template</button></div>'+fldBox());
 $('#edBox').onpointerdown=ev=>{const el=ev.target.closest('.el');if(!el)return;sel=+el.dataset.i;edDraw();props();const e=T()[sel],r=$('#edBox .card').getBoundingClientRect(),k=86/r.width,sx=ev.clientX,sy=ev.clientY,ox=e.x,oy=e.y;
  const mv=m=>{e.x=+(ox+(m.clientX-sx)*k).toFixed(1);e.y=+(oy+(m.clientY-sy)*k).toFixed(1);edDraw()},u=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',u);props()};addEventListener('pointermove',mv);addEventListener('pointerup',u)};
 edDraw();props()};
function edDraw(){const b=$('#edBox'),Z=Math.max(1,Math.min(2.2,(innerWidth-(innerWidth>900?580:50))/325));b.style.width=325*Z+'px';b.style.height=208*Z+'px';b.style.overflow='hidden';

 if(e.t=='text'||e.t=='field')x+='<label><input type="checkbox" '+(e.b?'checked':'')+' onchange="pe(\'b\',this.checked?1:0)"> Tebal</label> <label><input type="checkbox" '+(e.up?'checked':'')+' onchange="pe(\'up\',this.checked?1:0)"> KAPITAL</label><select onchange="pe(\'a\',this.value)">'+['left','center','right'].map(a=>'<option value="'+a+'" '+((e.a||'left')==a?'selected':'')+'>Rata '+a+'</option>').join('')+'</select>';
 if(e.t=='text')x+='<label>Teks (boleh {nama_sekolah}, {nama_kepsek}, {nama})<input type="text" value="'+esc(e.v)+'" oninput="pe(\'v\',this.value)"></label>';
 if(e.t=='field')x+='<label>Data<select onchange="pe(\'src\',this.value)">'+FV().map(f=>'<option value="'+f[0]+'" '+(f[0]==e.src?'selected':'')+'>'+esc(f[1])+'</option>').join('')+'</select></label><label>Label (kosongkan jika tanpa label)<input type="text" value="'+esc(e.l||'')+'" oninput="pe(\'l\',this.value)"></label>';
 if(e.t=='img')x+='<label>Sumber<select onchange="pe(\'src\',this.value)"><option value="kop" '+(e.src=='kop'?'selected':'')+'>Kop sekolah</option><option value="logo" '+(e.src=='logo'?'selected':'')+'>Logo sekolah</option><option value="ttd" '+(e.src=='ttd'?'selected':'')+'>TTD Kepsek</option>'+(e.src!='kop'&&e.src!='ttd'&&e.src!='logo'?'<option selected>Gambar kustom</option>':'')+'</select></label><input type="file" accept="image/*" onchange="imgEl(this.files[0])">';
 if(e.t=='field'){if(e.lw==null)e.lw=15;if(e.cg==null)e.cg=3}
 if(e.t=='text'||e.t=='field')x+='<label>Jenis Font<select onchange="pe(\'ff\',this.value)">'+FONTS.map(f=>'<option '+((e.ff||'Poppins')==f?'selected':'')+'>'+f+'</option>').join('')+'</select></label>';
 if(e.t=='field')x+='<div class="fg">'+n('lw','Lebar kolom label / jarak ke titik dua (mm)')+n('cg','Jarak titik dua ke isi (mm)')+'</div><label>Jarak antar baris (mm)<input type="number" step=".5" id="ls" value="5"></label><button class="bt g" onclick="rapikan()">✨ Rapikan semua Data</button><p class="mu">Menyamakan posisi, font, dan kolom titik dua semua elemen Data mengikuti elemen yang dipilih.</p>';
 if(e.t=='photo')x+='<b>Bentuk sudut foto (mm)</b><div class="fg">'+['Kiri-atas','Kanan-atas','Kanan-bawah','Kiri-bawah'].map((l,i)=>'<label>'+l+'<input type="number" step=".5" min="0" value="'+((e.rad||[0,0,0,0])[i])+'" oninput="pr('+i+',+this.value)"></label>').join('')+n('bw','Tebal bingkai (mm)')+'<label>Warna bingkai<input type="color" value="'+(e.bc||'#000000')+'" oninput="pe(\'bc\',this.value)"></label></div>'+[['Persegi',[0,0,0,0]],['Membulat',[3,3,3,3]],['Daun',[0,8,0,8]],['Daun 2',[8,0,8,0]],['Oval',[999,999,999,999]]].map(p=>'<button class="bt o" onclick="setRad('+JSON.stringify(p[1])+')">'+p[0]+'</button>').join('')+'<p class="mu">Tips: tambahkan elemen Gambar (PNG transparan) di atas foto untuk bingkai/pola khusus.</p>';
 p.innerHTML=layers()+x+'<button class="bt o" onclick="dupE()">Duplikat</button><button class="bt o" onclick="delE()">Hapus</button>'}
const LN={text:'Teks',field:'Data',photo:'Foto',qr:'QR',img:'Gambar',line:'Garis'};
function layers(){return '<b>Layer</b><div class="chips">'+T().map((e,i)=>'<label style="cursor:pointer;'+(i==sel?'background:#C7E3FF':'')+'" onclick="selE('+i+')">'+(i+1)+'. '+LN[e.t]+(e.t=='field'?': '+esc(e.src):e.t=='text'?': '+esc(String(e.v).slice(0,10)):'')+'</label>').join('')+'</div><button class="bt o" onclick="mvE(-1)">Ke belakang</button><button class="bt o" onclick="mvE(1)">Ke depan</button><br>'}
function selE(i){sel=i;edDraw();props()}
function mvE(d){const a=T(),j=sel+d;if(sel<0||j<0||j>=a.length)return;const x=a[sel];a[sel]=a[j];a[j]=x;sel=j;edDraw();props()}

 F.forEach((q,i)=>{q.x=x0;q.y=+(y0+i*ls).toFixed(1);q.h=ls;q.w=e.w;q.lw=e.lw;q.cg=e.cg;q.fs=e.fs;q.ff=e.ff;q.c=e.c});edDraw();toast('Semua Data dirapikan')}

function addE(t){const d={text:{t:'text',v:'Teks',x:5,y:5,w:40,h:5,fs:8},field:{t:'field',src:'nama',l:'Nama',x:5,y:5,w:60,h:5,fs:7},photo:{t:'photo',x:5,y:5,w:20,h:30},qr:{t:'qr',x:20,y:5,w:30,h:30},img:{t:'img',src:'kop',x:5,y:5,w:40,h:10},line:{t:'line',x:5,y:5,w:70,h:0}}[t];T().push(Object.assign({},d));sel=T().length-1;edDraw();props()}
